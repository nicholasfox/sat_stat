<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satellite TLE Analyzer</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 0; display: flex; flex-direction: column; }
.header { padding: 12px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); flex-shrink: 0; }
.header h1 { font-size: 20px; color: #fff; margin-bottom: 8px; }
.header-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.header-row label { font-size: 13px; color: #aaa; display: flex; align-items: center; gap: 3px; }
.header-row select, .header-row input { background: #16213e; color: #e0e0e0; border: 1px solid #333; border-radius: 4px; padding: 3px 6px; font-size: 13px; }
.header-row input { width: 70px; }
.btn { padding: 6px 16px; border: none; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: 500; }
.btn-update { background: #7c4dff; color: #fff; }
.btn-update:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-analyze { background: #00c853; color: #fff; padding: 8px 24px; font-size: 15px; }
.btn-analyze:disabled { opacity: 0.5; cursor: not-allowed; }
.status { color: #aaa; font-size: 12px; }
.main { display: flex; flex: 1; min-height: 0; }
.sidebar-wrap { display: flex; flex-shrink: 0; }
.sidebar { width: 400px; overflow-y: auto; padding: 8px 0; }
.resize-handle { width: 5px; cursor: col-resize; flex-shrink: 0; background: transparent; transition: background 0.15s; }
.resize-handle:hover, .resize-handle.active { background: rgba(255,255,255,0.15); }
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
.cat-section { margin-bottom: 2px; }
.cat-section-header { display: flex; align-items: center; padding: 4px 14px; font-size: 12px; font-weight: 600; color: #999; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; user-select: none; }
.cat-section-header:hover { background: rgba(255,255,255,0.03); }
.cat-section-dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; flex-shrink: 0; }
.cat-toggle { font-size: 10px; color: #555; margin-left: 8px; cursor: pointer; }
.cat-toggle:hover { color: #999; }
.sub-check { display: flex; align-items: center; padding: 3px 14px 3px 26px; cursor: pointer; gap: 6px; }
.sub-check:hover { background: rgba(255,255,255,0.04); }
.sub-check input { flex-shrink: 0; accent-color: #7c4dff; }
.sub-check-label { flex: 1; min-width: 0; font-size: 13px; line-height: 1.3; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.sub-check-meta { font-size: 11px; color: #666; }
.sub-check-range { font-size: 11px; color: #888; margin-left: 8px; }
.sub-check-count { font-size: 11px; color: #555; white-space: nowrap; }
.content { flex: 1; display: flex; flex-direction: column; padding: 16px 20px; min-width: 0; overflow-y: auto; }
.chart-container { background: #16213e; border-radius: 8px; padding: 16px; display: none; flex-shrink: 0; }
.chart-container canvas { width: 100%; height: 100%; }
.summary { font-size: 12px; color: #aaa; margin-top: 6px; flex-shrink: 0; }
.loading { text-align: center; padding: 40px; color: #666; }
.error { color: #ff5252; padding: 10px; }
</style>
</head>
<body>
<div class="header">
  <h1>Satellite Orbit Altitude Distribution</h1>
  <div class="header-row">
    <button class="btn btn-update" id="btnUpdate" onclick="updateTLE()">Update TLE</button>
    <span class="status" id="tleEpoch"></span>
    <span class="status" id="statusText">Loading...</span>
    <span style="flex:1"></span>
    <button class="btn btn-analyze" id="btnAnalyze" onclick="analyze()">Analyze</button>
    <label>Bin:
      <select id="binWidth" onchange="analyze()">
        <option value="1">1 km</option>
        <option value="2">2 km</option>
        <option value="5">5 km</option>
        <option value="10" selected>10 km</option>
        <option value="20">20 km</option>
        <option value="50">50 km</option>
        <option value="100">100 km</option>
        <option value="200">200 km</option>
        <option value="500">500 km</option>
        <option value="1000">1000 km</option>
      </select>
    </label>
    <label>H:
      <input type="number" id="binHeight" value="20" min="1" max="100" step="1" onchange="analyze()" style="width:50px"> px
    </label>
  </div>
</div>
<div class="main">
  <div class="sidebar-wrap">
    <div class="sidebar" id="sidebar"></div>
    <div class="resize-handle" id="resizeHandle"></div>
  </div>
  <div class="content">
    <div class="chart-container" id="chartContainer">
      <canvas id="histogramChart"></canvas>
    </div>
    <div class="summary" id="summaryText"></div>
  </div>
</div>

<script>
let allSats = [];
let categories = [];
let chartInstance = null;

async function api(method, url, body) {
  const opts = { method, headers: {} };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(url, opts);
  return r.json();
}

async function init() {
  const tleInfo = await api('GET', '/api/tle_info');
  if (tleInfo.epoch) {
    document.getElementById('tleEpoch').textContent = tleInfo.epoch;
  }
  if (tleInfo.count) {
    document.getElementById('statusText').textContent = tleInfo.count + ' satellites';
    await loadData();
  } else {
    document.getElementById('statusText').textContent = 'No cached data. Click Update to fetch.';
    document.getElementById('sidebar').innerHTML = '<div class="loading">No TLE data yet</div>';
  }
  await checkHash();
}

async function updateTLE() {
  const btn = document.getElementById('btnUpdate');
  btn.disabled = true;
  document.getElementById('statusText').textContent = 'Downloading TLE data from Celestrak...';
  try {
    const r = await api('POST', '/update');
    if (r.status === 'ok') {
      document.getElementById('statusText').textContent = r.count + ' satellites updated';
      const ti = await api('GET', '/api/tle_info');
      if (ti.epoch) document.getElementById('tleEpoch').textContent = ti.epoch.substring(0, 10);
      await loadData();
    } else {
      document.getElementById('statusText').textContent = 'Error: ' + r.message;
    }
  } catch (e) {
    document.getElementById('statusText').textContent = 'Network error';
  }
  btn.disabled = false;
}

async function loadData() {
  document.getElementById('sidebar').innerHTML = '<div class="loading">Loading data...</div>';
  const [catRes, dataRes] = await Promise.all([
    api('GET', '/api/categories'),
    api('GET', '/api/data')
  ]);
  if (dataRes.status !== 'ok') {
    document.getElementById('sidebar').innerHTML = '<div class="error">' + dataRes.message + '</div>';
    return;
  }
  allSats = dataRes.satellites;
  categories = catRes.categories;

  const subCounts = {};
  for (const s of allSats) {
    subCounts[s.sub_key] = (subCounts[s.sub_key] || 0) + 1;
  }

  const defaultChecked = new Set(['starlink']);

  let html = '<div style="padding:4px 14px 8px;display:flex;gap:8px;border-bottom:1px solid rgba(255,255,255,0.08);margin-bottom:4px">';
  html += '<span class="cat-toggle" onclick="selectAll(true)" style="font-size:12px">ALL</span>';
  html += '<span class="cat-toggle" onclick="selectAll(false)" style="font-size:12px">NONE</span>';
  html += '</div>';

  for (const cat of categories) {
    html += '<div class="cat-section">';
    html += '<div class="cat-section-header">';
    html += '<span class="cat-section-dot" style="background:' + cat.color + '"></span>';
    html += cat.label;
    html += '<span class="cat-toggle" onclick="event.stopPropagation();selectCategory(\'' + cat.key + '\',true)">all</span>';
    html += '<span class="cat-toggle" onclick="event.stopPropagation();selectCategory(\'' + cat.key + '\',false)">none</span>';
    html += '</div>';
    for (const sub of cat.subcategories) {
      const cnt = subCounts[sub.key] || 0;
      const metaParts = [sub.country, sub.operator].filter(Boolean);
      if (sub.name_zh) metaParts.push(sub.name_zh);
      const metaStr = metaParts.length ? metaParts.join('  ·  ') : '';
      const checked = defaultChecked.has(sub.key) ? 'checked' : '';
      html += '<label class="sub-check">';
      html += '<input type="checkbox" class="sub-cb" data-cat="' + cat.key + '" data-sub="' + sub.key + '" ' + checked + ' onchange="updateSelectedCount()">';
      html += '<span class="sub-check-label"><span>' + sub.label + '</span>';
      if (sub.range_max > 0) html += '<span class="sub-check-range">' + sub.range_min + '-' + sub.range_max + 'km</span>';
      if (metaStr) html += '<span class="sub-check-meta">' + metaStr + '</span>';
      html += '</span>';
      html += '<span class="sub-check-count">' + cnt + '</span>';
      html += '</label>';
    }
    html += '</div>';
  }
  const uncatCount = subCounts['uncategorized'] || 0;
  html += '<div class="cat-section"><div class="cat-section-header"><span class="cat-section-dot" style="background:#E0E0E0"></span>Uncategorized<span class="cat-toggle" onclick="event.stopPropagation();selectCategory(\'uncategorized\',true)">all</span><span class="cat-toggle" onclick="event.stopPropagation();selectCategory(\'uncategorized\',false)">none</span></div>';
  html += '<label class="sub-check"><input type="checkbox" class="sub-cb" data-cat="uncategorized" data-sub="uncategorized" onchange="updateSelectedCount()"><span class="sub-check-label"><span>Uncategorized</span></span><span class="sub-check-count">' + uncatCount + '</span></label></div>';

  document.getElementById('sidebar').innerHTML = html;
  document.getElementById('statusText').textContent = dataRes.count + ' satellites loaded';

  // Restore selection from hash
  applyHash();
}

function selectAll(checked) {
  document.querySelectorAll('.sub-cb').forEach(cb => cb.checked = checked);
  updateSelectedCount();
}

function selectCategory(catKey, checked) {
  document.querySelectorAll('.sub-cb[data-cat="' + catKey + '"]').forEach(cb => cb.checked = checked);
  updateSelectedCount();
}

function updateSelectedCount() {
  const selected = getSelectedSubs();
  if (selected.length === 0) {
    document.getElementById('statusText').textContent = '0 satellites selected';
    return;
  }
  const cnt = allSats.filter(s => selected.includes(s.sub_key) && s.h_mean !== null).length;
  document.getElementById('statusText').textContent = cnt + ' satellites in selected range (of ' + allSats.length + ' total)';
}

function getSelectedSubs() {
  const subs = new Set();
  document.querySelectorAll('.sub-cb:checked').forEach(cb => subs.add(cb.dataset.sub));
  return Array.from(subs);
}

function syncHash() {
  const selected = getSelectedSubs();
  const bw = document.getElementById('binWidth').value;
  const params = new URLSearchParams();
  if (selected.length) params.set('s', selected.join(','));
  if (bw !== '10') params.set('bw', bw);
  const bh = document.getElementById('binHeight').value;
  if (bh !== '20') params.set('bh', bh);
  const hash = params.toString();
  if (hash) history.replaceState(null, '', '#' + hash);
  else history.replaceState(null, '', window.location.pathname);
}

function applyHash() {
  const hash = location.hash.replace(/^#/, '');
  if (!hash) return;
  const params = new URLSearchParams(hash);
  if (params.has('s')) {
    const checked = new Set(params.get('s').split(','));
    document.querySelectorAll('.sub-cb').forEach(cb => {
      cb.checked = checked.has(cb.dataset.sub);
    });
  }
  if (params.has('bw')) document.getElementById('binWidth').value = params.get('bw');
  if (params.has('bh')) document.getElementById('binHeight').value = params.get('bh');
}

async function checkHash() {
  if (location.hash) {
    applyHash();
    await analyze();
  }
}

async function analyze() {
  const selected = getSelectedSubs();
  if (selected.length === 0) {
    document.getElementById('statusText').textContent = 'Select at least one subcategory';
    document.getElementById('chartContainer').style.display = 'none';
    return;
  }
  syncHash();

  const btn = document.getElementById('btnAnalyze');
  btn.disabled = true;
  document.getElementById('statusText').textContent = 'Analyzing...';

  const binWidth = parseInt(document.getElementById('binWidth').value, 10);
  const binHeight = Math.min(100, parseInt(document.getElementById('binHeight').value, 10) || 20);

  try {
    const r = await api('POST', '/api/analyze', {
      selected_subcategories: selected,
      bin_width: binWidth,
    });
    if (r.status !== 'ok' || r.bins.length === 0) {
      document.getElementById('statusText').textContent = 'No data for selected categories';
      btn.disabled = false;
      return;
    }
    renderChart(r);
    document.getElementById('statusText').textContent = r.count + ' satellites in selected range (of ' + r.total + ' total)';
  } catch (e) {
    document.getElementById('statusText').textContent = 'Analyze failed';
  }
  btn.disabled = false;
}

function renderChart(result) {
  const container = document.getElementById('chartContainer');
  container.style.display = 'block';

  const labels = result.bins.map(b => b.min + '-' + b.max + ' km');

  const subColorMap = {};
  const subLabelMap = {};
  for (const cat of categories)
    for (const sub of cat.subcategories) {
      subColorMap[sub.key] = sub.color;
      subLabelMap[sub.key] = sub.label;
    }
  subColorMap['uncategorized'] = '#E0E0E0';
  subLabelMap['uncategorized'] = 'Uncategorized';

  const allSubKeys = new Set();
  for (const b of result.bins)
    for (const sk in b.subcategories) allSubKeys.add(sk);

  const sortedSubs = [];
  for (const cat of categories)
    for (const sub of cat.subcategories)
      if (allSubKeys.has(sub.key)) sortedSubs.push(sub);
  if (allSubKeys.has('uncategorized'))
    sortedSubs.push({ key: 'uncategorized', label: 'Uncategorized', color: '#E0E0E0' });

  const datasets = [];
  for (const sub of sortedSubs) {
    const data = result.bins.map(b => b.subcategories[sub.key] || 0);
    datasets.push({
      label: sub.label,
      data: data,
      backgroundColor: sub.color,
      borderWidth: 0,
      borderRadius: 2,
    });
  }

  if (chartInstance) chartInstance.destroy();

  const PX_PER_BIN = Math.min(100, parseInt(document.getElementById('binHeight').value, 10) || 20);
  const binCount = result.bins.length;
  const chartHeight = Math.max(250, binCount * PX_PER_BIN + 120);
  container.style.height = chartHeight + 'px';

  document.getElementById('summaryText').textContent =
    'Bin width: ' + result.bin_width + ' km | Range min: ' + result.range_min +
    ' km | Height: ' + document.getElementById('binHeight').value + ' px | Range: ' +
    result.bins[0].min + ' – ' + result.bins[result.bins.length - 1].max +
    ' km | ' + result.count + ' satellites';

  const canvas = document.getElementById('histogramChart');
  const ctx = canvas.getContext('2d');
  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      interaction: {
        mode: 'index',
        intersect: false,
        axis: 'y'
      },
      plugins: {
        legend: { position: 'top', labels: { color: '#ccc', boxWidth: 14, padding: 12 } },
        tooltip: {
          filter: function(item) { return item.raw > 0; },
          callbacks: {
            title: function(items) { return items.length ? items[0].label : ''; },
            label: function(context) { return context.dataset.label + ': ' + context.raw; },
            footer: function(items) {
              if (!items.length) return '';
              const total = items.reduce((s, i) => s + i.raw, 0);
              return 'Total: ' + total + ' satellites';
            }
          }
        }
      },
      scales: {
        x: {
          stacked: true,
          beginAtZero: true,
          ticks: { color: '#999' },
          grid: { color: 'rgba(255,255,255,0.08)' },
          title: { display: true, text: 'Count', color: '#999' }
        },
        y: {
          stacked: true,
          ticks: { color: '#999', font: { size: 10 } },
          grid: { color: 'rgba(255,255,255,0.05)' },
          title: { display: true, text: 'Altitude (km)', color: '#999' }
        }
      },
      elements: {
        bar: { categoryPercentage: 1, barPercentage: 1 }
      }
    }
  });

}

init();

// Sidebar resize
(function() {
  const handle = document.getElementById('resizeHandle');
  const sidebar = document.getElementById('sidebar');
  let startX, startW;
  function onMove(e) {
    const dx = (e.clientX || e.touches?.[0]?.clientX || 0) - startX;
    const w = Math.max(200, Math.min(800, startW + dx));
    sidebar.style.width = w + 'px';
  }
  function onUp() {
    handle.classList.remove('active');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onUp);
  }
  handle.addEventListener('mousedown', function(e) {
    startX = e.clientX;
    startW = sidebar.offsetWidth;
    handle.classList.add('active');
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
  handle.addEventListener('touchstart', function(e) {
    startX = e.touches[0].clientX;
    startW = sidebar.offsetWidth;
    handle.classList.add('active');
    document.addEventListener('touchmove', onMove);
    document.addEventListener('touchend', onUp);
  });
})();
</script>
</body>
</html>
